# 奖励权重与速度项尺度：上游 v1 与本仓库 v2 的完整定义
#
# 参考配置：这些数值是 src/env_patch.py 中 REWARD_WEIGHTS_V1 / REWARD_WEIGHTS_V2 /
# VELOCITY_ERR_SCALE_V1 / VELOCITY_ERR_SCALE_V2 的说明性镜像，实际生效的值以代码为准
# （权重和必须为 1，apply_velocity_reward_v2 会断言这一点）。

reward_v1:                # 上游/论文原始定义
  pose: 0.50
  velocity: 0.05
  end_effector: 0.20
  root_pose: 0.15
  root_velocity: 0.10
  velocity_term: "exp(-0.1 * sum_j (dq_ref - dq_sim)^2)"
  # 实测（dog_pace 官方策略，9 回合 x 600 步 = 5400 步，取自 task.reward() 内部）：
  # sum_j (dq_ref-dq_sim)^2 均值 92.2（p10 48.9 / p50 87.4 / p90 146.0）
  # 该项取值 p10 4.6e-7 / p50 1.6e-4 / 均值 2.6e-3 / p90 7.5e-3 / max 0.041
  # 加权贡献 1.3e-4（占总奖励 0.02%）-> 该项在常用误差区间内基本饱和

reward_v2:                # 本仓库改进 2
  pose: 0.45
  velocity: 0.10
  end_effector: 0.20
  root_pose: 0.15
  root_velocity: 0.10
  velocity_term: "exp(-0.25 * mean_j (dq_ref - dq_sim)^2)"
  # 实测（同一批 5400 步反算）：该项 p10 0.048 / p50 0.162 / 均值 0.191 / p90 0.361 /
  # max 0.515，加权贡献 1.9e-2（占总奖励 2.6%）
  # 注：这是奖励信号数值分布的陈述，不是训练效果；未做 v2 的端到端重训

error_scales:             # 其余四项与论文一致，未改动
  pose: 5.0
  end_effector: 40.0
  root_pose: 20.0
  root_velocity: 2.0
