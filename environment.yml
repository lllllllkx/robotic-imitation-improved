# 与 requirements.txt 同源：本机实测跑通的版本（Windows 11 / Python 3.7.1 / CPU only）。
# 注意：conda 侧只锁 python，其余走 pip，避免 conda 解析出与 TF 1.14 不兼容的 numpy。
name: motion_imitation
channels:
  - defaults
dependencies:
  - python=3.7.1
  - pip
  - pip:
      - tensorflow==1.14.0
      - pybullet==3.2.0
      - gym==0.17.1
      - stable-baselines==2.10.0
      - numpy==1.17.3
      - scipy==1.7.3
      - matplotlib==3.5.3
      - mpi4py==3.0.3
      - imageio==2.31.2
      - Pillow==9.5.0
